<body class="bg-background text-on-background antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Dramatic Background Image -->
<div class="absolute inset-0 bg-cover bg-center z-0" data-alt="A gritty, high-contrast, black and white photograph of an MMA fighter in intense training, sweat dripping, focused expression. High-key dramatic lighting emphasizes muscle definition and determination. The overall aesthetic is dark, moody, and deeply intense, aligning perfectly with a hardcore combat sports brand. Subtle crimson accents highlight the intensity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBxxVVIcWeIfLNJD4SVLkvq4ccdl_ZZwe3kCF7_VTJO9BR1U8bPXQ2Z6WEVixY-2_QdsG_NaBllWQ5pAhwHvfwHLAJOE55r7mSpcgy9f_VgIDQvRLCmRSLKpZabb5mG-KKoGbrtLJcSLuqqyXaZeYoIFZkPSSkxUY6WQpYkZN1wqDo5UZKbLruXJNFXwdzhQKIDgdQOQvZnP7zhjCs5u-THWlZm4Yn943Z1cKLtXRQgvmrcSlybVWY')">

<div class="absolute inset-0 bg-background/80 backdrop-blur-sm"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/90 to-transparent"></div>
</div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<!-- Branding & Headline -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tighter mb-sm uppercase">FightIQ</h1>
<h2 class="font-headline-md text-headline-md text-on-background">Train Smarter. Fight Harder.</h2>
</div>
<!-- Glassmorphism Card -->
<div class="bg-surface/80 backdrop-blur-xl border border-white/10 rounded-xl p-md md:p-lg shadow-2xl relative overflow-hidden">
<!-- Subtle glow effect behind card -->
<div class="absolute -top-1/2 -left-1/2 w-full h-full bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<form class="space-y-md relative z-10">
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant block uppercase tracking-widest text-xs" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
<input class="w-full bg-background border border-white/10 rounded-lg py-sm pl-xl pr-sm font-body-md text-body-md text-on-background placeholder:text-on-surface-variant focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-colors" id="email" placeholder="athlete@dojo.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-on-surface-variant block uppercase tracking-widest text-xs" for="password">Password</label>
<a class="font-label-bold text-label-bold text-primary hover:text-primary-container transition-colors text-xs uppercase" href="#">Forgot?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
<input class="w-full bg-background border border-white/10 rounded-lg py-sm pl-xl pr-sm font-body-md text-body-md text-on-background placeholder:text-on-surface-variant focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary-container text-white font-label-bold text-label-bold py-sm rounded-lg uppercase tracking-widest hover:bg-primary-container/80 transition-colors flex justify-center items-center gap-xs mt-lg" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-lg flex items-center justify-center z-10">
<div class="absolute border-t border-white/10 w-full"></div>
<div class="relative bg-surface px-sm text-on-surface-variant font-label-bold text-label-bold text-xs uppercase tracking-widest rounded-full backdrop-blur-xl">Or Continue With</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-sm relative z-10">
<button class="flex items-center justify-center gap-sm bg-background border border-white/10 rounded-lg py-sm hover:border-white/30 transition-colors text-on-background font-label-bold text-label-bold" type="button">
<!-- Custom SVG for Google since Material Icons doesn't have brand logos -->
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>

                </button>

<svg class="w-5 h-5 text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.15 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.67 1.56-1.57 2.92-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path>
</svg>

</div>
<div class="mt-lg text-center z-10 relative">
<p class="font-body-md text-body-md text-on-surface-variant">Don't have an account? <a class="text-primary font-label-bold text-label-bold hover:underline" href="#">Sign Up</a></p>
