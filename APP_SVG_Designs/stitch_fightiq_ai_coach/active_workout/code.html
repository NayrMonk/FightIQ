<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FightIQ Active Workout</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#131314",
                        "primary-fixed": "#ffdad9",
                        "secondary": "#8affc0",
                        "surface-variant": "#353436",
                        "on-secondary-fixed": "#002112",
                        "secondary-fixed": "#4fffb0",
                        "background": "#131314",
                        "surface-tint": "#ffb3b3",
                        "on-tertiary-container": "#2a292c",
                        "on-surface-variant": "#e6bcbc",
                        "on-secondary": "#003822",
                        "primary": "#ffb3b3",
                        "on-tertiary-fixed-variant": "#474649",
                        "on-primary-fixed-variant": "#920022",
                        "on-surface": "#e5e2e3",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "secondary-fixed-dim": "#00e295",
                        "inverse-on-surface": "#313031",
                        "on-secondary-fixed-variant": "#005233",
                        "on-error": "#690005",
                        "inverse-surface": "#e5e2e3",
                        "error-container": "#93000a",
                        "outline": "#ad8887",
                        "on-primary-fixed": "#400009",
                        "primary-container": "#ff5261",
                        "surface-container-low": "#1c1b1c",
                        "on-primary-container": "#5b0011",
                        "surface-container-lowest": "#0e0e0f",
                        "error": "#ffb4ab",
                        "on-tertiary": "#303032",
                        "surface-bright": "#3a393a",
                        "on-secondary-container": "#00633f",
                        "on-error-container": "#ffdad6",
                        "surface-dim": "#131314",
                        "primary-fixed-dim": "#ffb3b3",
                        "tertiary-fixed": "#e4e2e4",
                        "tertiary-container": "#929092",
                        "on-background": "#e5e2e3",
                        "outline-variant": "#5d3f3f",
                        "on-primary": "#680015",
                        "surface-container-high": "#2a2a2b",
                        "surface-container-highest": "#353436",
                        "on-tertiary-fixed": "#1b1b1d",
                        "inverse-primary": "#bf002f",
                        "secondary-container": "#00e999",
                        "surface-container": "#201f20",
                        "tertiary": "#c8c6c8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "gutter": "16px",
                        "xs": "4px",
                        "xl": "64px",
                        "base": "8px",
                        "margin-mobile": "16px",
                        "sm": "12px",
                        "lg": "40px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-bold": ["Inter"],
                        "headline-lg-mobile": ["Archivo Narrow"],
                        "headline-lg": ["Archivo Narrow"],
                        "body-md": ["Inter"],
                        "display-xl": ["Archivo Narrow"],
                        "stats-numeric": ["Archivo Narrow"],
                        "headline-md": ["Archivo Narrow"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-lg": ["40px", { "lineHeight": "44px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-xl": ["72px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "stats-numeric": ["32px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        .timer-glow {
            text-shadow: 0 0 20px rgba(255, 46, 77, 0.4);
        }
        .intensity-bg {
            background: radial-gradient(circle at center, rgba(255, 46, 77, 0.15) 0%, rgba(10, 10, 11, 1) 70%);
        }
        
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden intensity-bg flex flex-col font-body-md select-none">
<!-- Top Header / Context -->
<header class="flex-none p-margin-mobile md:p-margin-desktop flex justify-between items-start pt-safe">
<div class="flex flex-col gap-xs">
<h1 class="font-headline-md text-headline-md text-on-surface">Round 3 of 12</h1>
<p class="font-body-md text-body-md text-secondary">Shadowboxing - Combinations 1-2-3-2</p>
</div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="font-stats-numeric text-stats-numeric text-secondary">168</span>
</div>
</header>
<!-- Main Active Area -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile relative">
<!-- Timer UI -->
<div class="relative flex items-center justify-center w-full max-w-sm aspect-square">
<!-- Progress Ring -->
<svg class="absolute w-full h-full" viewbox="0 0 200 200">
<!-- Background track -->
<circle class="stroke-surface-container-high" cx="100" cy="100" fill="none" r="90" stroke-linecap="round" stroke-width="6"></circle>
<!-- Progress track (simulated) -->
<circle class="progress-ring__circle" cx="100" cy="100" fill="none" r="90" stroke="#FF2E4D" stroke-dasharray="565.48" stroke-dashoffset="150" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Digital Readout -->
<div class="flex flex-col items-center justify-center z-10">
<span class="font-display-xl text-display-xl text-[#FF2E4D] timer-glow tracking-tighter" style="font-variant-numeric: tabular-nums;">02:45</span>
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase mt-xs">Work</span>
</div>
</div>
<!-- Next Up Preview -->
<div class="mt-lg flex items-center gap-md bg-surface-container/50 border border-white/10 rounded-xl px-md py-sm backdrop-blur-sm">
<span class="material-symbols-outlined text-on-surface-variant">timer</span>
<div class="flex flex-col">
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase text-[10px]">Up Next</span>
<span class="font-body-md text-body-md text-on-surface">Rest (0:30)</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant ml-sm">arrow_forward</span>
</div>
</main>
<!-- Bottom Controls -->
<footer class="flex-none p-margin-mobile pb-safe flex flex-col md:flex-row gap-md justify-center w-full max-w-xl mx-auto">
<button class="flex-1 bg-surface-container border border-white/10 text-on-surface font-label-bold text-label-bold h-14 rounded-full flex items-center justify-center gap-xs active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span>
            PAUSE
        </button>
<button class="flex-1 bg-error-container text-on-error-container font-label-bold text-label-bold h-14 rounded-full flex items-center justify-center gap-xs active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">stop</span>
            END SESSION
        </button>
</footer>
</body></html>
