<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FightIQ - Onboarding Step 3</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ffb4ab",
                        "inverse-surface": "#e5e2e3",
                        "secondary-container": "#00e999",
                        "inverse-on-surface": "#313031",
                        "primary": "#ffb3b3",
                        "on-secondary-container": "#00633f",
                        "on-primary-container": "#5b0011",
                        "tertiary-fixed": "#e4e2e4",
                        "tertiary": "#c8c6c8",
                        "surface-container": "#201f20",
                        "surface-variant": "#353436",
                        "outline-variant": "#5d3f3f",
                        "surface-dim": "#131314",
                        "primary-fixed-dim": "#ffb3b3",
                        "on-primary-fixed-variant": "#920022",
                        "on-tertiary-container": "#2a292c",
                        "on-tertiary-fixed-variant": "#474649",
                        "on-secondary-fixed-variant": "#005233",
                        "surface-container-highest": "#353436",
                        "on-primary": "#680015",
                        "background": "#131314",
                        "surface-container-low": "#1c1b1c",
                        "secondary-fixed-dim": "#00e295",
                        "tertiary-container": "#929092",
                        "on-surface-variant": "#e6bcbc",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "on-background": "#e5e2e3",
                        "outline": "#ad8887",
                        "secondary-fixed": "#4fffb0",
                        "error-container": "#93000a",
                        "on-tertiary": "#303032",
                        "surface": "#131314",
                        "primary-fixed": "#ffdad9",
                        "surface-container-high": "#2a2a2b",
                        "on-secondary": "#003822",
                        "secondary": "#8affc0",
                        "on-tertiary-fixed": "#1b1b1d",
                        "surface-container-lowest": "#0e0e0f",
                        "on-error-container": "#ffdad6",
                        "inverse-primary": "#bf002f",
                        "on-primary-fixed": "#400009",
                        "surface-bright": "#3a393a",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#002112",
                        "primary-container": "#ff5261",
                        "on-surface": "#e5e2e3",
                        "surface-tint": "#ffb3b3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px",
                        "sm": "12px",
                        "lg": "40px",
                        "md": "24px",
                        "xl": "64px",
                        "xs": "4px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "headline-md": ["Archivo Narrow"],
                        "display-xl": ["Archivo Narrow"],
                        "stats-numeric": ["Archivo Narrow"],
                        "headline-lg-mobile": ["Archivo Narrow"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Archivo Narrow"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-xl": ["72px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "stats-numeric": ["32px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["40px", { "lineHeight": "44px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom animations for the trend line */
        @keyframes drawLine {
            0% { stroke-dashoffset: 1000; }
            100% { stroke-dashoffset: 0; }
        }
        .trend-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 2s ease-out forwards;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .bg-glow {
            animation: pulse-glow 4s infinite alternate ease-in-out;
        }
    </style>
</head>
<body class="bg-[#0A0A0B] text-on-surface font-body-md min-h-screen flex flex-col items-center justify-between relative overflow-hidden selection:bg-primary-container selection:text-white">
<!-- Ambient Background Glow -->
<div class="absolute top-1/4 right-0 w-[500px] h-[500px] bg-primary-container/10 rounded-full blur-[120px] -z-10 bg-glow pointer-events-none mix-blend-screen"></div>
<div class="absolute bottom-1/4 left-0 w-[400px] h-[400px] bg-secondary/10 rounded-full blur-[100px] -z-10 bg-glow pointer-events-none mix-blend-screen" style="animation-delay: 2s;"></div>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-3xl mx-auto flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-lg z-10 relative">
<!-- Progress Indicator -->
<div class="w-full flex justify-center mb-xl">
<div class="flex gap-2 items-center">
<div class="w-8 h-1 bg-surface-variant rounded-full overflow-hidden"></div>
<div class="w-8 h-1 bg-surface-variant rounded-full overflow-hidden"></div>
<div class="w-8 h-1 bg-primary rounded-full overflow-hidden shadow-[0_0_8px_rgba(255,82,97,0.5)]"></div>
</div>
</div>
<!-- Hero Visual: Neon Mint Trend Line -->
<div class="relative w-full aspect-video md:aspect-[21/9] bg-[#1C1C1E] border border-white/10 rounded-xl mb-xl flex items-center justify-center p-md overflow-hidden shadow-[0_4px_30px_rgba(0,0,0,0.5)] backdrop-blur-md">
<!-- Grid Lines for Chart -->
<div class="absolute inset-0 grid grid-cols-4 grid-rows-4 pointer-events-none opacity-20">
<div class="border-b border-r border-white/20"></div><div class="border-b border-r border-white/20"></div><div class="border-b border-r border-white/20"></div><div class="border-b border-white/20"></div>
<div class="border-b border-r border-white/20"></div><div class="border-b border-r border-white/20"></div><div class="border-b border-r border-white/20"></div><div class="border-b border-white/20"></div>
<div class="border-b border-r border-white/20"></div><div class="border-b border-r border-white/20"></div><div class="border-b border-r border-white/20"></div><div class="border-b border-white/20"></div>
<div class="border-r border-white/20"></div><div class="border-r border-white/20"></div><div class="border-r border-white/20"></div><div></div>
</div>
<!-- SVG Trend Line -->
<svg class="w-full h-full drop-shadow-[0_0_12px_rgba(34,242,161,0.6)]" preserveaspectratio="none" viewbox="0 0 800 400">
<defs>
<lineargradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#22F2A1" stop-opacity="0.2"></stop>
<stop offset="100%" stop-color="#22F2A1" stop-opacity="1"></stop>
</lineargradient>
<lineargradient id="areaGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#22F2A1" stop-opacity="0.3"></stop>
<stop offset="100%" stop-color="#1C1C1E" stop-opacity="0"></stop>
</lineargradient>
</defs>
<!-- Area under the curve -->
<path class="opacity-0" d="M 0 350 Q 100 350, 200 250 T 400 200 T 600 100 T 800 50 L 800 400 L 0 400 Z" fill="url(#areaGrad)" style="animation: fadeIn 1s ease-out 1s forwards;"></path>
<!-- The Line -->
<path class="trend-path" d="M 0 350 Q 100 350, 200 250 T 400 200 T 600 100 T 800 50" fill="none" stroke="url(#lineGrad)" stroke-linecap="round" stroke-width="6"></path>
<!-- Data Points (Static for now, glowing) -->
<circle class="opacity-0 shadow-[0_0_10px_#22F2A1]" cx="200" cy="250" fill="#22F2A1" r="6" style="animation: fadeIn 0.5s ease-out 0.5s forwards;"></circle>
<circle class="opacity-0 shadow-[0_0_10px_#22F2A1]" cx="400" cy="200" fill="#22F2A1" r="6" style="animation: fadeIn 0.5s ease-out 1.0s forwards;"></circle>
<circle class="opacity-0 shadow-[0_0_10px_#22F2A1]" cx="600" cy="100" fill="#22F2A1" r="6" style="animation: fadeIn 0.5s ease-out 1.5s forwards;"></circle>
<circle class="opacity-0 shadow-[0_0_15px_#22F2A1]" cx="800" cy="50" fill="#FFFFFF" r="8" style="animation: fadeIn 0.5s ease-out 2.0s forwards;"></circle>
</svg>
<!-- Floating Data Tag -->
<div class="absolute top-4 right-4 bg-surface/80 backdrop-blur-md border border-white/10 rounded-lg px-sm py-xs flex items-center gap-2 opacity-0" style="animation: slideDown 0.8s ease-out 2s forwards;">
<span class="material-symbols-outlined text-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">trending_up</span>
<span class="font-stats-numeric text-stats-numeric text-secondary text-sm leading-none">+24% Output</span>
</div>
</div>
<!-- Copy -->
<div class="text-center md:text-left mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-white mb-sm">
                Level Up Your Game
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mx-auto md:mx-0">
                Turn your sweat into data. Visualize your progress with detailed analytics and discipline breakdowns.
            </p>
</div>
<!-- Action -->
<div class="w-full flex justify-center md:justify-start">
<button class="w-full md:w-auto bg-[#FF2E4D] text-white font-label-bold text-label-bold py-4 px-xl rounded-lg hover:opacity-80 transition-opacity active:scale-95 transform duration-200 flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(255,46,77,0.3)]">
                Enter Dashboard
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</main>
<style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body></html>
