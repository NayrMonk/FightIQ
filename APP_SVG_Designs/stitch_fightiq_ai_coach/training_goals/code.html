<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FightIQ - Onboarding Goals &amp; Experience</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-bright": "#3a393a",
                      "surface-container-highest": "#353436",
                      "secondary-fixed-dim": "#00e295",
                      "surface-tint": "#ffb3b3",
                      "on-secondary-container": "#00633f",
                      "on-secondary": "#003822",
                      "outline": "#ad8887",
                      "on-primary-container": "#5b0011",
                      "secondary-fixed": "#4fffb0",
                      "surface-container-high": "#2a2a2b",
                      "primary": "#ffb3b3",
                      "on-surface": "#e5e2e3",
                      "secondary": "#8affc0",
                      "surface-variant": "#353436",
                      "on-secondary-fixed-variant": "#005233",
                      "on-primary-fixed-variant": "#920022",
                      "background": "#131314",
                      "primary-container": "#ff5261",
                      "error": "#ffb4ab",
                      "tertiary-fixed": "#e4e2e4",
                      "tertiary-fixed-dim": "#c8c6c8",
                      "on-error-container": "#ffdad6",
                      "inverse-on-surface": "#313031",
                      "on-surface-variant": "#e6bcbc",
                      "on-secondary-fixed": "#002112",
                      "outline-variant": "#5d3f3f",
                      "surface-dim": "#131314",
                      "on-error": "#690005",
                      "secondary-container": "#00e999",
                      "on-primary-fixed": "#400009",
                      "inverse-primary": "#bf002f",
                      "on-tertiary": "#303032",
                      "error-container": "#93000a",
                      "inverse-surface": "#e5e2e3",
                      "on-primary": "#680015",
                      "surface": "#131314",
                      "tertiary-container": "#929092",
                      "on-tertiary-fixed-variant": "#474649",
                      "primary-fixed-dim": "#ffb3b3",
                      "on-background": "#e5e2e3",
                      "surface-container-lowest": "#0e0e0f",
                      "on-tertiary-container": "#2a292c",
                      "primary-fixed": "#ffdad9",
                      "tertiary": "#c8c6c8",
                      "surface-container-low": "#1c1b1c",
                      "surface-container": "#201f20",
                      "on-tertiary-fixed": "#1b1b1d"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "base": "8px",
                      "lg": "40px",
                      "sm": "12px",
                      "md": "24px",
                      "gutter": "16px",
                      "xl": "64px",
                      "margin-desktop": "32px",
                      "xs": "4px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "label-bold": ["Inter"],
                      "headline-lg-mobile": ["Archivo Narrow"],
                      "stats-numeric": ["Archivo Narrow"],
                      "headline-lg": ["Archivo Narrow"],
                      "headline-md": ["Archivo Narrow"],
                      "display-xl": ["Archivo Narrow"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "label-bold": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                      "headline-lg-mobile": ["32px", {"lineHeight": "36px", "fontWeight": "700"}],
                      "stats-numeric": ["32px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "headline-lg": ["40px", {"lineHeight": "44px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "display-xl": ["72px", {"lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        /* High-contrast functional styles */
        .glass-card {
            background-color: theme('colors.surface-container-low');
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .active-card {
            background-color: rgba(255, 179, 179, 0.15); /* Primary tinted */
            border: 1px solid theme('colors.primary');
            box-shadow: 0 0 15px rgba(255, 179, 179, 0.15);
        }
        
        .active-icon {
            color: theme('colors.primary');
        }
        
        .progress-bar-bg {
            background-color: theme('colors.surface-variant');
        }
        
        .progress-bar-fill {
            background-color: theme('colors.primary');
        }
        
        /* Custom radio button hide */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop overflow-x-hidden antialiased selection:bg-primary selection:text-on-primary">
<!-- Progress Indicator -->
<div class="fixed top-0 left-0 w-full pt-12 px-margin-mobile z-50 flex flex-col items-center max-w-3xl mx-auto right-0">
<div class="w-full flex justify-between items-center mb-base">
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-widest">Step 3 of 3</span>
<span class="font-label-bold text-label-bold text-primary">Final Setup</span>
</div>
<div class="w-full h-1 progress-bar-bg rounded-full overflow-hidden">
<div class="h-full progress-bar-fill rounded-full" style="width: 100%;"></div>
</div>
</div>
<!-- Main Content Container -->
<main class="w-full max-w-2xl flex flex-col gap-xl mt-24 pb-32">
<header class="text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-sm">
                Define your trajectory.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                We'll tailor your dashboard and training regimens based on your current focus and experience level.
            </p>
</header>
<!-- Goals Section -->
<section class="flex flex-col gap-md">
<h2 class="font-headline-md text-headline-md text-on-surface border-b border-white/10 pb-base">Primary Goal</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Option 1 -->
<label class="cursor-pointer group">
<input checked="" class="visually-hidden peer" name="goal" type="radio" value="technique"/>
<div class="glass-card p-md rounded-lg h-full transition-all duration-200 peer-checked:active-card hover:border-white/30">
<div class="flex items-start gap-gutter">
<span class="material-symbols-outlined text-3xl peer-checked:active-icon text-on-surface-variant transition-colors" data-icon="sports_martial_arts">sports_martial_arts</span>
<div>
<h3 class="font-label-bold text-label-bold text-on-surface mb-xs group-hover:text-primary transition-colors">Improve Technique</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Focus on form, combinations, and defensive mastery.</p>
</div>
</div>
</div>
</label>
<!-- Option 2 -->
<label class="cursor-pointer group">
<input class="visually-hidden peer" name="goal" type="radio" value="conditioning"/>
<div class="glass-card p-md rounded-lg h-full transition-all duration-200 peer-checked:active-card hover:border-white/30">
<div class="flex items-start gap-gutter">
<span class="material-symbols-outlined text-3xl peer-checked:active-icon text-on-surface-variant transition-colors" data-icon="monitor_heart">monitor_heart</span>
<div>
<h3 class="font-label-bold text-label-bold text-on-surface mb-xs group-hover:text-primary transition-colors">Build Conditioning</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Enhance cardio, stamina, and muscular endurance for longer rounds.</p>
</div>
</div>
</div>
</label>
<!-- Option 3 -->
<label class="cursor-pointer group">
<input class="visually-hidden peer" name="goal" type="radio" value="fight_prep"/>
<div class="glass-card p-md rounded-lg h-full transition-all duration-200 peer-checked:active-card hover:border-white/30">
<div class="flex items-start gap-gutter">
<span class="material-symbols-outlined text-3xl peer-checked:active-icon text-on-surface-variant transition-colors" data-icon="swords">swords</span>
<div>
<h3 class="font-label-bold text-label-bold text-on-surface mb-xs group-hover:text-primary transition-colors">Prepare for a Fight</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Intensive camp simulation balancing sparring, S&amp;C, and weight cuts.</p>
</div>
</div>
</div>
</label>
<!-- Option 4 -->
<label class="cursor-pointer group">
<input class="visually-hidden peer" name="goal" type="radio" value="fitness"/>
<div class="glass-card p-md rounded-lg h-full transition-all duration-200 peer-checked:active-card hover:border-white/30">
<div class="flex items-start gap-gutter">
<span class="material-symbols-outlined text-3xl peer-checked:active-icon text-on-surface-variant transition-colors" data-icon="fitness_center">fitness_center</span>
<div>
<h3 class="font-label-bold text-label-bold text-on-surface mb-xs group-hover:text-primary transition-colors">General Fitness</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Use combat sports principles to stay lean and active.</p>
</div>
</div>
</div>
</label>
</div>
</section>
<!-- Experience Level Section -->
<section class="flex flex-col gap-md">
<h2 class="font-headline-md text-headline-md text-on-surface border-b border-white/10 pb-base">Experience Level</h2>
<div class="flex flex-col md:flex-row gap-gutter">
<!-- Beginner -->
<label class="cursor-pointer flex-1 group">
<input class="visually-hidden peer" name="experience" type="radio" value="beginner"/>
<div class="glass-card p-md rounded-lg text-center h-full transition-all duration-200 peer-checked:active-card hover:border-white/30 flex flex-col items-center justify-center gap-sm">
<span class="material-symbols-outlined text-4xl peer-checked:active-icon text-on-surface-variant transition-colors" data-icon="stat_1">stat_1</span>
<h3 class="font-label-bold text-label-bold text-on-surface group-hover:text-primary transition-colors">Beginner</h3>
<span class="font-body-md text-body-md text-on-surface-variant text-xs">0-1 Years</span>
</div>
</label>
<!-- Intermediate -->
<label class="cursor-pointer flex-1 group">
<input checked="" class="visually-hidden peer" name="experience" type="radio" value="intermediate"/>
<div class="glass-card p-md rounded-lg text-center h-full transition-all duration-200 peer-checked:active-card hover:border-white/30 flex flex-col items-center justify-center gap-sm">
<span class="material-symbols-outlined text-4xl peer-checked:active-icon text-on-surface-variant transition-colors" data-icon="stat_2">stat_2</span>
<h3 class="font-label-bold text-label-bold text-on-surface group-hover:text-primary transition-colors">Intermediate</h3>
<span class="font-body-md text-body-md text-on-surface-variant text-xs">1-3 Years</span>
</div>
</label>
<!-- Advanced -->
<label class="cursor-pointer flex-1 group">
<input class="visually-hidden peer" name="experience" type="radio" value="advanced"/>
<div class="glass-card p-md rounded-lg text-center h-full transition-all duration-200 peer-checked:active-card hover:border-white/30 flex flex-col items-center justify-center gap-sm">
<span class="material-symbols-outlined text-4xl peer-checked:active-icon text-on-surface-variant transition-colors" data-icon="stat_3">stat_3</span>
<h3 class="font-label-bold text-label-bold text-on-surface group-hover:text-primary transition-colors">Advanced</h3>
<span class="font-body-md text-body-md text-on-surface-variant text-xs">3+ Years</span>
</div>
</label>
</div>
</section>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-xl border-t border-white/10 p-margin-mobile flex justify-center z-50">
<div class="w-full max-w-2xl flex gap-gutter justify-between">
<button class="px-lg py-sm font-label-bold text-label-bold text-secondary border border-secondary rounded-lg hover:opacity-80 transition-opacity min-w-[120px]" type="button">
                BACK
            </button>
<button class="px-lg py-sm font-label-bold text-label-bold text-on-primary bg-primary rounded-lg hover:opacity-80 transition-opacity flex-1 max-w-[300px] flex justify-center items-center gap-2" type="button">
                COMPLETE SETUP <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</body></html>
