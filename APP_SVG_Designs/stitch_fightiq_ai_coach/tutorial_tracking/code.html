<body class="bg-[#0A0A0B] text-on-background min-h-screen flex flex-col justify-between overflow-hidden">
<!-- Background Elements -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden flex items-center justify-center opacity-30">
<div class="w-[800px] h-[800px] rounded-full bg-electric-crimson/10 blur-[120px] mix-blend-screen absolute -top-40 -right-40"></div>
<div class="w-[600px] h-[600px] rounded-full bg-surface-container/20 blur-[100px] absolute -bottom-20 -left-20"></div>
</div>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center z-10 px-margin-mobile md:px-margin-desktop py-lg max-w-5xl mx-auto w-full relative h-full">
<!-- Mockup Visual -->
<div class="relative w-full max-w-sm aspect-[9/16] mb-xl flex-shrink-0 perspective-1000">
<div class="glass-card rounded-[40px] w-full h-full p-6 flex flex-col items-center relative overflow-hidden transform rotate-[-2deg] shadow-2xl transition-transform duration-500 hover:rotate-0">
<!-- Inner Mockup UI -->
<div class="w-full flex justify-between items-center mb-8 opacity-60">
<span class="material-symbols-outlined text-sm">menu</span>
<span class="font-label-bold text-label-bold text-xs">ROUND 1</span>
<span class="material-symbols-outlined text-sm">settings</span>
</div>
<!-- Main Timer -->
<div class="relative w-48 h-48 rounded-full border-[12px] border-surface flex items-center justify-center mb-8 glow-effect">
<!-- Progress Arc (Simplified with SVG) -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="44" stroke="#FF2E4D" stroke-dasharray="276" stroke-dashoffset="100" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<div class="flex flex-col items-center">
<span class="font-display-xl text-display-xl text-electric-crimson tracking-tighter">2:45</span>
<span class="font-label-bold text-label-bold text-on-surface-variant text-xs mt-1">REMAINING</span>
</div>
</div>
<!-- Stats Grid -->
<div class="w-full grid grid-cols-2 gap-4">
<div class="bg-[#0A0A0B] border border-white/10 rounded-lg p-3 text-center">
<span class="block font-label-bold text-label-bold text-neon-mint text-[10px] mb-1">HEART RATE</span>
<span class="font-stats-numeric text-stats-numeric text-on-background text-lg">165</span>
<span class="text-[10px] text-on-surface-variant ml-1">BPM</span>
</div>
<div class="bg-[#0A0A0B] border border-white/10 rounded-lg p-3 text-center">
<span class="block font-label-bold text-label-bold text-neon-mint text-[10px] mb-1">INTENSITY</span>
<span class="font-stats-numeric text-stats-numeric text-on-background text-lg">82</span>
<span class="text-[10px] text-on-surface-variant ml-1">%</span>
</div>
</div>
<!-- Mockup Shine Effect -->
<div class="absolute top-0 left-0 w-full h-[30%] bg-gradient-to-b from-white/5 to-transparent pointer-events-none"></div>
</div>
</div>
<!-- Typography & Storytelling -->
<div class="text-center w-full max-w-2xl px-4 flex flex-col items-center">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-4">
                Track Every Round
            </h1>
<p class="font-body-md md:font-body-lg text-body-md md:text-body-lg text-on-surface-variant max-w-md mx-auto">
                Our intelligent timers capture your intensity, volume, and recovery in real-time. Stay focused on the fight, we'll handle the data.
            </p>
</div>

<!-- Bottom Navigation / Action Area -->
<footer class="w-full px-margin-mobile md:px-margin-desktop pb-lg pt-md z-20">
<div class="max-w-5xl mx-auto flex flex-col items-center">
<!-- Progress Indicator -->
<div class="flex space-x-2 mb-8">
<div class="w-8 h-1 rounded-full bg-electric-crimson"></div>
<div class="w-8 h-1 rounded-full bg-surface-variant"></div>
<div class="w-8 h-1 rounded-full bg-surface-variant"></div>
</div>
<!-- CTAs -->
<div class="w-full max-w-sm flex flex-col space-y-4">
<button class="w-full bg-[#FF2E4D] hover:bg-opacity-80 text-white font-label-bold text-label-bold py-4 rounded-xl transition-all duration-300 transform hover:scale-[0.98] flex justify-center items-center">
                    Next
                </button>
<button class="w-full bg-transparent border border-white/10 text-on-surface-variant hover:text-white font-label-bold text-label-bold py-4 rounded-xl transition-all duration-300">
                    Skip
                </button>
