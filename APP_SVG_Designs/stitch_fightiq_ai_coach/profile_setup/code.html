<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Basic Profile - FightIQ Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-primary-fixed-variant": "#920022",
                        "background": "#131314",
                        "primary-container": "#ff5261",
                        "error": "#ffb4ab",
                        "tertiary-fixed": "#e4e2e4",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#313031",
                        "on-surface-variant": "#e6bcbc",
                        "on-secondary-fixed": "#002112",
                        "outline-variant": "#5d3f3f",
                        "surface-dim": "#131314",
                        "on-error": "#690005",
                        "secondary-container": "#00e999",
                        "on-primary-fixed": "#400009",
                        "inverse-primary": "#bf002f",
                        "on-tertiary": "#303032",
                        "error-container": "#93000a",
                        "inverse-surface": "#e5e2e3",
                        "on-primary": "#680015",
                        "surface": "#131314",
                        "tertiary-container": "#929092",
                        "on-tertiary-fixed-variant": "#474649",
                        "primary-fixed-dim": "#ffb3b3",
                        "on-background": "#e5e2e3",
                        "surface-container-lowest": "#0e0e0f",
                        "on-tertiary-container": "#2a292c",
                        "primary-fixed": "#ffdad9",
                        "tertiary": "#c8c6c8",
                        "surface-container-low": "#1c1b1c",
                        "surface-container": "#201f20",
                        "on-tertiary-fixed": "#1b1b1d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {

                        "lg": "40px",
                        "sm": "12px",
                        "md": "24px",
                        "gutter": "16px",
                        "xl": "64px",

                        "xs": "4px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter", "sans-serif"],
                        "headline-lg-mobile": ["Archivo Narrow", "sans-serif"],
                        "stats-numeric": ["Archivo Narrow", "sans-serif"],

                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #0A0A0B;
        }
        .glass-card {
            background: rgba(28, 28, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field {
            background-color: #0A0A0B;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e5e2e3;
            transition: border-color 0.2s ease-in-out;
        }
        .input-field:focus {
            border-color: #22F2A1; /* Neon Mint override from prompt */
            outline: none;
            box-shadow: none;
        }
        .btn-primary {
            background-color: #FF2E4D; /* Electric Crimson override from prompt */
            color: #FFFFFF;
            transition: opacity 0.2s ease-in-out;
        }
        .btn-primary:active {
            opacity: 0.8;
        }
        .gender-btn {
            background-color: #0A0A0B;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e5e2e3;
            transition: all 0.2s ease-in-out;
        }
        .gender-btn.selected {
            background-color: rgba(255, 46, 77, 0.15); /* Primary tint */
            border-color: #FF2E4D;
            color: #FF2E4D;
        }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Progress Indicator -->
<div class="fixed top-0 left-0 w-full p-6 flex justify-between items-center z-50 pointer-events-none">
<div class="w-full max-w-md mx-auto flex gap-2">
<div class="h-1 flex-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary opacity-50 w-full rounded-full"></div>
</div>
<div class="h-1 flex-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/2 rounded-full shadow-[0_0_8px_rgba(255,179,179,0.5)]"></div>
</div>
<div class="h-1 flex-1 bg-surface-container rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container rounded-full"></div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md relative z-10 flex flex-col gap-xl mt-12 md:mt-0">
<!-- Header -->
<header class="text-center md:text-left space-y-sm">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tighter">
                Tell us about yourself.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Basic details help us calibrate your initial training parameters.
            </p>
</header>
<!-- Form Container -->
<form class="glass-card rounded-xl p-md flex flex-col gap-lg" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- Full Name -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface" for="fullName">FULL NAME</label>
<input class="input-field w-full rounded-lg px-4 py-3 font-body-md text-body-md placeholder:text-on-surface-variant/50" id="fullName" placeholder="Fighter Name" required="" type="text"/>
</div>
<!-- Age & Weight Grid -->
<div class="grid grid-cols-2 gap-gutter">
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface" for="age">AGE</label>
<div class="relative">
<input class="input-field w-full rounded-lg px-4 py-3 font-stats-numeric text-stats-numeric placeholder:text-on-surface-variant/50 appearance-none" id="age" max="99" min="16" placeholder="00" required="" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 font-label-bold text-label-bold text-on-surface-variant">YRS</span>
</div>
</div>
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface" for="weight">WEIGHT</label>
<div class="relative">
<input class="input-field w-full rounded-lg px-4 py-3 font-stats-numeric text-stats-numeric placeholder:text-on-surface-variant/50 appearance-none" id="weight" max="300" min="40" placeholder="000" required="" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 font-label-bold text-label-bold text-on-surface-variant">LBS</span>
</div>
</div>
</div>
<!-- Gender Selection -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface mb-2">DIVISION CLASSIFICATION</label>
<div class="grid grid-cols-3 gap-base">
<button class="gender-btn rounded-lg py-3 font-label-bold text-label-bold text-center selected" onclick="selectGender(this)" type="button">
                        Male
                    </button>
<button class="gender-btn rounded-lg py-3 font-label-bold text-label-bold text-center" onclick="selectGender(this)" type="button">
                        Female
                    </button>
<button class="gender-btn rounded-lg py-3 font-label-bold text-label-bold text-center" onclick="selectGender(this)" type="button">
                        Other
                    </button>
</div>
</div>
</form>
<!-- Action Area -->
<div class="mt-4">
<button class="btn-primary w-full py-4 rounded-lg font-label-bold text-label-bold uppercase tracking-wider flex items-center justify-center gap-2" type="button">
                Continue
                <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
</main>
<script>
        function selectGender(clickedBtn) {
            const buttons = document.querySelectorAll('.gender-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));
            clickedBtn.classList.add('selected');
        }
    </script>
</body></html>
