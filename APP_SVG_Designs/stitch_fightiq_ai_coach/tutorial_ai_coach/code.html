<main class="flex-1 w-full max-w-md mx-auto flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop z-10 relative">
<!-- Visual: AI Chat Interface -->
<div class="w-full h-64 mb-xl relative">
<div class="absolute inset-0 flex flex-col justify-center gap-md">
<!-- AI Insight Bubble -->
<div class="glass-panel rounded-xl p-md flex items-start gap-4 self-start max-w-[85%] transform -translate-y-4 shadow-lg shadow-black/50">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 border border-white/10">
<span class="material-symbols-outlined text-secondary">smart_toy</span>
</div>
<div>
<p class="font-label-bold text-label-bold text-secondary mb-1">Coach IQ</p>

</div>
</div>
<!-- User Bubble (Decorative) -->
<div class="crimson-gradient rounded-xl p-sm px-md self-end max-w-[70%] transform translate-x-4 border border-white/5 opacity-80">
<p class="font-body-md text-body-md text-white text-right">Show me the breakdown.</p>
</div>
</div>
</div>

<div class="text-center w-full max-w-sm mb-lg">

<p class="font-body-md text-body-md md:font-body-lg md:text-body-lg text-on-surface-variant">Coach IQ analyzes your training history to provide personalized feedback and custom workouts.</p>

</div>
